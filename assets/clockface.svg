<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clockface outer rim -->
  <circle cx="12" cy="12" r="8.5" />
  <!-- Clockface cardinal ticks (12, 3, 6, 9 o'clock) -->
  <line x1="12" y1="5.2" x2="12" y2="7.2" />
  <line x1="18.8" y1="12" x2="16.8" y2="12" />
  <line x1="12" y1="18.8" x2="12" y2="16.8" />
  <line x1="5.2" y1="12" x2="7.2" y2="12" />
  <!-- Clock hands: 10:10 aesthetic clockface -->
  <line x1="12" y1="12" x2="9" y2="9.5" />
  <line x1="12" y1="12" x2="15.5" y2="8" />
  <!-- Center pinion -->
  <circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none" />
</svg>
