<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Colorful Recent Files Rainbow Spectrum Gradient -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF8773" />
      <stop offset="20%" stop-color="#CD861A" />
      <stop offset="40%" stop-color="#E0B97F" />
      <stop offset="60%" stop-color="#86CF86" />
      <stop offset="80%" stop-color="#57A3F8" />
      <stop offset="100%" stop-color="#AD80D7" />
    </linearGradient>
  </defs>

  <!-- Scaled up circular clock (scale 1.07 centered at 64,64) filling ~123px diameter -->
  <g transform="translate(64, 64) scale(1.07) translate(-64, -64)">
    <!-- Outer Rainbow Heat Halo (Clock Rim) -->
    <circle cx="64" cy="64" r="55" fill="none" stroke="url(#rainbowGrad)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Inner Clockface Body (r=47) -->
    <circle cx="64" cy="64" r="47" fill="#0f1115" stroke="#252a33" stroke-width="1.5" />

    <!-- Bold Clockface Ticks at 12, 3, 6, 9 -->
    <line x1="64" y1="23" x2="64" y2="31" stroke="#E0B97F" stroke-width="3.5" stroke-linecap="round" />
    <line x1="105" y1="64" x2="97" y2="64" stroke="#86CF86" stroke-width="3.5" stroke-linecap="round" />
    <line x1="64" y1="105" x2="64" y2="97" stroke="#57A3F8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="23" y1="64" x2="31" y2="64" stroke="#CD861A" stroke-width="3.5" stroke-linecap="round" />

    <!-- Minor Ticks -->
    <circle cx="84" cy="29" r="1.8" fill="#64748b" />
    <circle cx="99" cy="44" r="1.8" fill="#64748b" />
    <circle cx="99" cy="84" r="1.8" fill="#64748b" />
    <circle cx="84" cy="99" r="1.8" fill="#64748b" />
    <circle cx="44" cy="99" r="1.8" fill="#64748b" />
    <circle cx="29" cy="84" r="1.8" fill="#64748b" />
    <circle cx="29" cy="44" r="1.8" fill="#64748b" />
    <circle cx="44" cy="29" r="1.8" fill="#64748b" />

    <!-- Bold Clock Hands (10:10 Smiling Clockface) -->
    <line x1="64" y1="64" x2="43" y2="43" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
    <line x1="64" y1="64" x2="89" y2="37" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" />

    <!-- Center Pinion -->
    <circle cx="64" cy="64" r="5.5" fill="#EF8773" stroke="#f8fafc" stroke-width="2" />
  </g>
</svg>